name: Build & Package Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android
          chmod +x android/gradlew

      - name: Build Debug APK via Gradle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK for Easy Distribution
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/DatingApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DatingApp-APK
          path: build-artifacts/DatingApp.apk
          retention-days: 7
